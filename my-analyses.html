<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>분석결과 - TalonInsight</title>
  <meta name="description" content="내가 분석한 앱 목록과 상세 결과를 확인하세요.">

  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="apple-touch-icon" href="assets/images/logo.png">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#1E5AE8",
            "background-light": "#f6f6f8",
            "background-dark": "#111621",
          },
          fontFamily: { "display": ["Inter", "Noto Sans KR", "sans-serif"] },
          borderRadius: {
            "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem",
            "2xl": "1rem", "full": "9999px"
          },
          screens: { 'sm': '640px', 'md': '768px', 'lg': '1024px', 'xl': '1280px' }
        },
      },
    }
  </script>
</head>
<body class="font-display bg-background-light min-h-screen">

  <div id="app-header"></div>

  <!-- 목록 뷰 -->
  <div id="list-view" class="max-w-[1200px] mx-auto px-4 sm:px-6 md:px-10 lg:px-20 xl:px-[100px] py-6 md:py-8">
    <h1 class="text-2xl font-bold text-[#111318] mb-6">분석결과</h1>

    <!-- 로딩 -->
    <div id="list-loading" class="flex flex-col items-center py-20 gap-3">
      <div class="w-8 h-8 border-2 border-primary border-t-transparent rounded-full animate-spin"></div>
      <p class="text-sm text-[#636e88]">불러오는 중...</p>
    </div>

    <!-- 비로그인 -->
    <div id="list-unauth" class="hidden flex flex-col items-center py-20 gap-4 text-center">
      <span class="material-symbols-outlined text-5xl text-[#c4c8d4]">lock</span>
      <p class="text-base font-medium text-[#111318]">로그인이 필요합니다</p>
      <p class="text-sm text-[#636e88]">Google 로그인 후 분석 기록을 확인하세요.</p>
    </div>

    <!-- 빈 목록 -->
    <div id="list-empty" class="hidden flex flex-col items-center py-20 gap-4 text-center">
      <span class="material-symbols-outlined text-5xl text-[#c4c8d4]">analytics</span>
      <p class="text-base font-medium text-[#111318]">아직 분석 기록이 없습니다</p>
      <p class="text-sm text-[#636e88]">앱을 검색하고 첫 번째 분석을 시작해보세요.</p>
      <a href="index.html" class="mt-2 px-5 py-2.5 bg-primary text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors">
        분석 시작하기
      </a>
    </div>

    <!-- 목록 -->
    <div id="list-container" class="hidden flex flex-col gap-3"></div>
  </div>

  <!-- 상세 뷰 -->
  <div id="detail-view" class="hidden max-w-[1200px] mx-auto px-4 sm:px-6 md:px-10 lg:px-20 xl:px-[100px] py-6 md:py-8">
    <!-- 뒤로가기 -->
    <button id="back-btn" class="flex items-center gap-1.5 text-sm text-[#636e88] hover:text-primary mb-6 transition-colors">
      <span class="material-symbols-outlined text-base">arrow_back</span>
      목록으로
    </button>

    <!-- 앱 정보 헤더 -->
    <div id="detail-header" class="bg-white rounded-xl p-4 md:p-6 shadow-sm border border-[#dcdee5] mb-6 md:mb-8"></div>

    <!-- 분석 섹션들 -->
    <div id="detail-sections" class="flex flex-col gap-5"></div>
  </div>

  <div id="app-footer"></div>
  <script type="module" src="my-analyses.js"></script>
</body>
</html>
