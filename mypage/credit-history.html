<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FHEBQXPMJ3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FHEBQXPMJ3');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>크레딧 사용내역 - TalonInsight</title>
  <meta name="description" content="크레딧 충전 및 사용 내역을 확인하세요.">

  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link rel="apple-touch-icon" href="../assets/images/logo.png">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: { "primary": "#1E5AE8", "background-light": "#f6f6f8", "background-dark": "#111621" },
          fontFamily: { "display": ["Inter", "Noto Sans KR", "sans-serif"] },
          borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
          screens: { 'sm': '640px', 'md': '768px', 'lg': '1024px', 'xl': '1280px' }
        },
      },
    }
  </script>
</head>
<body class="font-display bg-background-light min-h-screen">

  <div id="app-header"></div>

  <div class="max-w-3xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-[#111318] mb-6" data-i18n="credit.history_title">Credit History</h1>

    <!-- 잔여 크레딧 요약 -->
    <div id="credit-summary" class="hidden mb-6 p-5 bg-white rounded-2xl border border-[#e8eaf0] shadow-sm flex items-center justify-between">
      <div>
        <p class="text-sm text-[#636e88] font-medium" data-i18n="credit.remaining">Remaining Credits</p>
        <p id="credit-balance" class="text-2xl font-black text-primary mt-1">- C</p>
      </div>
      <a href="/payment/pricing.html" class="px-4 py-2 bg-primary text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors">
        <span data-i18n="credit.charge_btn">Top Up</span>
      </a>
    </div>

    <!-- 로딩 -->
    <div id="list-loading" class="flex flex-col items-center py-20 gap-3">
      <div class="w-8 h-8 border-2 border-primary border-t-transparent rounded-full animate-spin"></div>
      <p class="text-sm text-[#636e88]" data-i18n="common.loading">Loading...</p>
    </div>

    <!-- 비로그인 -->
    <div id="list-unauth" class="hidden flex flex-col items-center py-20 gap-4 text-center">
      <span class="material-symbols-outlined text-5xl text-[#c4c8d4]">lock</span>
      <p class="text-base font-medium text-[#111318]" data-i18n="common.login_required">Login Required</p>
      <p class="text-sm text-[#636e88]" data-i18n="credit.history_unauth_msg">Sign in with Google to view your credit history.</p>
    </div>

    <!-- 빈 목록 -->
    <div id="list-empty" class="hidden flex flex-col items-center py-20 gap-4 text-center">
      <span class="material-symbols-outlined text-5xl text-[#c4c8d4]">toll</span>
      <p class="text-base font-medium text-[#111318]" data-i18n="credit.history_empty_title">No credit history</p>
      <p class="text-sm text-[#636e88]" data-i18n="credit.history_empty_msg">Top up credits or start an analysis.</p>
    </div>

    <!-- 내역 테이블 -->
    <div id="list-container" class="hidden bg-white rounded-2xl border border-[#e8eaf0] shadow-sm overflow-hidden">
      <table class="w-full">
        <thead>
          <tr class="border-b border-[#f0f1f4] bg-[#f8f9ff]">
            <th class="text-left px-5 py-3.5 text-xs font-semibold text-[#636e88] uppercase tracking-wide" data-i18n="credit.col_date">Date</th>
            <th class="text-left px-5 py-3.5 text-xs font-semibold text-[#636e88] uppercase tracking-wide" data-i18n="credit.col_desc">Description</th>
            <th class="text-right px-5 py-3.5 text-xs font-semibold text-[#636e88] uppercase tracking-wide" data-i18n="credit.col_amount">Credits</th>
          </tr>
        </thead>
        <tbody id="ledger-tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="app-footer"></div>
  <script type="module" src="credit-history.js"></script>
</body>
</html>
