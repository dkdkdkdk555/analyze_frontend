<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>분석결과 - TalonInsight</title>
  <meta name="description" content="내가 분석한 앱 목록과 상세 결과를 확인하세요.">

  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link rel="apple-touch-icon" href="../assets/images/logo.png">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#1E5AE8",
            "background-light": "#f6f6f8",
            "background-dark": "#111621",
          },
          fontFamily: { "display": ["Inter", "Noto Sans KR", "sans-serif"] },
          borderRadius: {
            "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem",
            "2xl": "1rem", "full": "9999px"
          },
          screens: { 'sm': '640px', 'md': '768px', 'lg': '1024px', 'xl': '1280px' }
        },
      },
    }
  </script>
</head>
<body class="font-display bg-background-light min-h-screen">

  <div id="app-header"></div>

  <!-- 목록 뷰 -->
  <div id="list-view" class="max-w-[1200px] mx-auto px-4 sm:px-6 md:px-10 lg:px-20 xl:px-[100px] py-6 md:py-8">
    <div class="mb-6 md:mb-8">
      <h1 class="text-2xl md:text-3xl font-bold text-[#111318]" data-i18n="mypage.analyses_title">My Analyses</h1>
      <p class="text-sm text-[#636e88] mt-1.5" data-i18n="mypage.analyses_subtitle">분석한 앱의 결과를 다시 확인하세요.</p>
    </div>

    <!-- 로딩 -->
    <div id="list-loading" class="flex flex-col items-center py-24 gap-3">
      <div class="w-8 h-8 border-2 border-primary border-t-transparent rounded-full animate-spin"></div>
      <p class="text-sm text-[#636e88]" data-i18n="mypage.loading">Loading...</p>
    </div>

    <!-- 비로그인 -->
    <div id="list-unauth" class="hidden flex flex-col items-center py-24 gap-4 text-center">
      <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mb-2">
        <span class="material-symbols-outlined text-4xl text-[#c4c8d4]">lock</span>
      </div>
      <p class="text-base font-semibold text-[#111318]" data-i18n="common.login_required">Login Required</p>
      <p class="text-sm text-[#636e88] max-w-xs" data-i18n="mypage.unauth_msg">Sign in with Google to view your analysis history.</p>
    </div>

    <!-- 빈 목록 -->
    <div id="list-empty" class="hidden flex flex-col items-center py-24 gap-4 text-center">
      <div class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mb-2">
        <span class="material-symbols-outlined text-4xl text-[#c4c8d4]">analytics</span>
      </div>
      <p class="text-base font-semibold text-[#111318]" data-i18n="mypage.empty_title">No analysis history yet</p>
      <p class="text-sm text-[#636e88] max-w-xs" data-i18n="mypage.empty_msg">Search for an app to start your first analysis.</p>
      <a href="/" class="mt-3 inline-flex items-center gap-2 px-5 py-2.5 bg-primary text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors" data-i18n="mypage.start_analysis">
        Start Analyzing
      </a>
    </div>

    <!-- 목록 -->
    <div id="list-container" class="hidden flex flex-col gap-3"></div>
  </div>

  <!-- 상세 뷰 -->
  <div id="detail-view" class="hidden max-w-[1200px] mx-auto px-4 sm:px-6 md:px-10 lg:px-20 xl:px-[100px] py-6 md:py-8">
    <!-- 뒤로가기 -->
    <button id="back-btn" class="flex items-center gap-1.5 text-sm text-[#636e88] hover:text-primary mb-6 transition-colors">
      <span class="material-symbols-outlined text-base">arrow_back</span>
      <span data-i18n="mypage.back_to_list">Back to list</span>
    </button>

    <!-- 앱 정보 헤더 -->
    <div id="detail-header" class="bg-white rounded-xl p-4 md:p-6 shadow-sm border border-[#dcdee5] mb-6 md:mb-8"></div>

    <!-- 분석 섹션들 -->
    <div id="detail-sections" class="flex flex-col gap-5"></div>
  </div>

  <div id="app-footer"></div>
  <script type="module" src="my-analyses.js"></script>
</body>
</html>
