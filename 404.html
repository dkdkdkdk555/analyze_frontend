<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Cloudflare Pages serves this file with a 404 status for any unknown path. -->
  <title>Page Not Found | TalonInsight</title>
  <meta name="description" content="This page doesn't exist. Go back to TalonInsight to run an App Store or Google Play market analysis.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1E5AE8">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root { --primary: #1E5AE8; --text: #111318; --muted: #636e88; --bg: #f6f6f8; --line: #dcdee5; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: var(--bg); color: var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }
    main { width: 100%; max-width: 480px; text-align: center; }
    .logo { display: inline-flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; font-weight: 800; }
    .code { margin: 32px 0 8px; font-size: 64px; font-weight: 900; letter-spacing: -0.04em; color: var(--primary); line-height: 1; }
    h1 { margin: 0 0 12px; font-size: 24px; line-height: 1.3; }
    p { margin: 0 0 28px; color: var(--muted); line-height: 1.6; }
    .cta { display: inline-block; padding: 12px 24px; border-radius: 12px; background: var(--primary); color: #fff; font-weight: 700; text-decoration: none; }
    .cta:hover { background: #174bc4; }
    nav { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px; }
    nav a { color: var(--muted); font-size: 14px; text-decoration: none; }
    nav a:hover { color: var(--primary); }
  </style>
</head>
<body>
  <main>
    <a class="logo" href="/">
      <img src="/assets/images/favicon.svg" alt="" width="24" height="24">
      TalonInsight
    </a>
    <div class="code">404</div>
    <h1>We couldn't find that page</h1>
    <p>The link may be broken or the page may have moved. Start a new app market analysis, or pick one of the pages below.</p>
    <a class="cta" href="/">Analyze an app</a>
    <nav aria-label="Site">
      <a href="/services/services">Services</a>
      <a href="/payment/pricing">Pricing</a>
      <a href="/blog/blog">Blog</a>
    </nav>
  </main>
</body>
</html>
