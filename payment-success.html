<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 완료 - TalonInsight</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { "primary": "#1E5AE8" },
          fontFamily: { "display": ["Noto Sans KR", "sans-serif"] },
        }
      }
    }
  </script>
</head>
<body class="bg-[#f6f6f8] font-display min-h-screen flex items-center justify-center p-4">
  <div id="app-header"></div>

  <div class="bg-white rounded-2xl shadow-sm p-10 max-w-sm w-full text-center">
    <!-- Loading -->
    <div id="loading-state">
      <div class="w-14 h-14 border-4 border-gray-200 border-t-primary rounded-full animate-spin mx-auto mb-6"></div>
      <p class="text-[#636e88] text-sm">결제를 확인하는 중이에요...</p>
    </div>

    <!-- Success -->
    <div id="success-state" class="hidden">
      <div class="w-16 h-16 bg-green-50 rounded-2xl flex items-center justify-center mx-auto mb-5">
        <span class="material-symbols-outlined text-green-500" style="font-size:36px">check_circle</span>
      </div>
      <h2 class="text-xl font-black text-[#111318] mb-2">충전 완료!</h2>
      <p id="success-msg" class="text-[#636e88] text-sm leading-relaxed mb-7"></p>
      <a href="/pricing.html"
        class="block w-full py-3 bg-primary text-white text-sm font-bold rounded-xl hover:bg-blue-700 transition-colors mb-2">
        더 충전하기
      </a>
      <a href="/"
        class="block w-full py-3 border border-[#e5e7eb] text-[#636e88] text-sm font-medium rounded-xl hover:border-[#111318] transition-colors">
        분석 시작하기
      </a>
    </div>

    <!-- Error -->
    <div id="error-state" class="hidden">
      <div class="w-16 h-16 bg-red-50 rounded-2xl flex items-center justify-center mx-auto mb-5">
        <span class="material-symbols-outlined text-red-400" style="font-size:36px">error</span>
      </div>
      <h2 class="text-xl font-black text-[#111318] mb-2">결제 처리 실패</h2>
      <p id="error-msg" class="text-[#636e88] text-sm leading-relaxed mb-7">결제 승인 중 오류가 발생했어요.</p>
      <a href="/pricing.html"
        class="block w-full py-3 bg-primary text-white text-sm font-bold rounded-xl hover:bg-blue-700 transition-colors">
        다시 시도
      </a>
    </div>
  </div>

  <script type="module" src="payment-success.js"></script>
</body>
</html>
